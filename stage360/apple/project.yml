# Every Seat Remote: one SwiftUI app for iPhone, iPad and Mac.
# Generate the Xcode project on a Mac with:
#   brew install xcodegen
#   cd stage360/apple && xcodegen
#   open EverySeatRemote.xcodeproj
name: EverySeatRemote
options:
  bundleIdPrefix: com.toolkityourlife
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID here, or pick it in Xcode → Signing & Capabilities
targets:
  EverySeatRemote:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: EverySeatRemote
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toolkityourlife.everyseat.remote
        PRODUCT_NAME: Seat Remote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seat Remote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # The Mac app is sandboxed and may only make outgoing network connections.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": EverySeatRemote/macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
