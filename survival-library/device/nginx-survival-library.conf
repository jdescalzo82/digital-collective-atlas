# Survival Library - nginx site. Installed by setup-pi.sh, which replaces @WEBROOT@, @IP@ and @CERTDIR@.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root @WEBROOT@;
    index index.html;

    # Captive portal: phones probe sites like connectivitycheck.gstatic.com or captive.apple.com.
    # Our DNS answers every name with this device, so send anything that isn't us to the library.
    if ($host !~* ^(@IP@|survival\.lan|library\.lan|localhost)$) {
        return 302 http://@IP@/;
    }

    include snippets/survival-library-common.conf;
}

server {
    # HTTPS with a self-signed certificate. Browsers warn once; after accepting, phones allow
    # the compass sensor, GPS and offline caching (service worker), which need a secure page.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    root @WEBROOT@;
    index index.html;
    ssl_certificate     @CERTDIR@/survival-library.crt;
    ssl_certificate_key @CERTDIR@/survival-library.key;

    include snippets/survival-library-common.conf;
}
