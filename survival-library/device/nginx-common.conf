# Shared by the http and https servers (installed as /etc/nginx/snippets/survival-library-common.conf)

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/geo+json model/stl image/svg+xml text/plain;

location / {
    try_files $uri $uri/ =404;
}
location ~ \.(html|json)$ {
    add_header Cache-Control "no-cache";
}
location ~ \.stl$      { default_type model/stl; }
location ~ \.scad$     { default_type text/plain; charset utf-8; }
location ~ \.geojson$  { default_type application/geo+json; }
location ~ \.pmtiles$  { default_type application/octet-stream; add_header Accept-Ranges bytes; }

# Explicit captive-portal probe paths (in case a phone uses the IP directly)
location = /generate_204        { return 302 /; }
location = /gen_204             { return 302 /; }
location = /hotspot-detect.html { return 302 /; }
location = /ncsi.txt            { return 302 /; }
location = /connecttest.txt     { return 302 /; }
